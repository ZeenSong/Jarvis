Quiet Home:
  primary-color: '#527969'
  accent-color: '#9cb99e'
  primary-font-family: '"Noto Sans", "Roboto", sans-serif'
  ha-card-border-radius: '24px'
  ha-card-border-width: '0px'
  ha-card-box-shadow: 'none'
  bubble-border-radius: '24px'
  bubble-main-background-color: 'var(--card-background-color)'
  bubble-accent-color: '#8cac94'
  bubble-icon-background-color: 'rgba(109, 144, 121, 0.16)'
  bubble-pop-up-border-radius: '28px'
  modes:
    light:
      primary-background-color: '#f2f4ef'
      secondary-background-color: '#e8ede5'
      card-background-color: '#ffffff'
      primary-text-color: '#263a33'
      secondary-text-color: '#738078'
      app-header-background-color: '#f2f4ef'
      app-header-text-color: '#263a33'
      sidebar-background-color: '#f9faf7'
      divider-color: '#e3e8df'
    dark:
      primary-background-color: '#18211e'
      secondary-background-color: '#202c27'
      card-background-color: '#25332d'
      primary-text-color: '#e8eee8'
      secondary-text-color: '#a6b7ad'
      app-header-background-color: '#18211e'
      app-header-text-color: '#e8eee8'
      sidebar-background-color: '#1c2621'
      divider-color: '#34463c'
