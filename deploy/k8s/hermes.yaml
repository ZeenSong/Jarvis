# The existing hermes-api Secret is managed separately; never apply a placeholder key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-jarvis-mcp
  namespace: jarvis
data:
  config.yaml: |
    model:
      provider: "deepseek"
      # DeepSeek's public API identifier for the V4.1-Flash release.
      default: "deepseek-flash"
    # Expose named Hermes Agent profiles below /p/<profile>/ on this gateway.
    gateway:
      multiplex_profiles: true
    # Jarvis is a Hermes Agent profile. Do not set platform_toolsets.api_server
    # here: an explicit whitelist would hide Hermes' native Skills, toolsets and
    # any MCP servers enabled for the Jarvis Agent.
    mcp_servers:
      jarvis:
        command: /opt/hermes/.venv/bin/python
        args: ["/opt/jarvis-mcp/jarvis_provider.py"]
        env:
          JARVIS_INTERNAL_URL: "${JARVIS_INTERNAL_URL}"
          JARVIS_BRIDGE_KEY: "${JARVIS_BRIDGE_KEY}"
  jarvis_provider.py: |
    """Jarvis capability provider for the Hermes Jarvis Agent.

    Jarvis is a first-class Hermes Agent profile. This MCP server is only its
    Jarvis-kernel capability bridge; it is not the Agent identity.
    """

    from __future__ import annotations

    import asyncio
    import json
    import os
    import sys
    from urllib.request import Request, urlopen
    from urllib.error import HTTPError
    from typing import Literal

    from mcp.server import MCPServer


    BASE_URL = os.environ.get("JARVIS_INTERNAL_URL", "http://jarvis-server:8080").rstrip("/")
    BRIDGE_KEY = os.environ.get("JARVIS_BRIDGE_KEY", "")


    def _call(tool: str, context_token: str, **arguments: object) -> str:
        body = json.dumps({
            "tool": tool,
            "context_token": context_token,
            "arguments": arguments,
        }).encode("utf-8")
        request = Request(
            f"{BASE_URL}/internal/hermes/capability",
            data=body,
            method="POST",
            headers={
                "Content-Type": "application/json",
                "X-Jarvis-Bridge-Key": BRIDGE_KEY,
            },
        )
        try:
            with urlopen(request, timeout=30) as response:
                return json.dumps(json.load(response), ensure_ascii=False)
        except HTTPError as exc:
            return exc.read(16000).decode("utf-8", errors="replace")
        except Exception as exc:
            return json.dumps({"error": str(exc)}, ensure_ascii=False)


    server = MCPServer(
        "jarvis",
        instructions=(
            "Jarvis kernel capability provider for the first-class Jarvis Agent. "
            "Hermes owns reasoning and the "
            "tool loop; use these tools for current Jarvis state, metrics, user runs, "
            "usage, and dashboard views. Every tool call requires the exact context_token "
            "from the Jarvis system message. Never invent one."
        ),
    )


    @server.tool()
    def system_status_read(context_token: str) -> str:
        """读取 Jarvis 服务器当前状态。"""
        return _call("system_status_read", context_token)


    @server.tool()
    def system_metrics_read(context_token: str) -> str:
        """读取 Jarvis 最近 24 小时实际采集的系统指标。"""
        return _call("system_metrics_read", context_token)


    @server.tool()
    def agent_list(context_token: str) -> str:
        """读取当前用户可见的 Agent、Task 和 Run。"""
        return _call("agent_list", context_token)


    @server.tool()
    def llm_usage_read(context_token: str) -> str:
        """读取当前用户的模型用量。"""
        return _call("llm_usage_read", context_token)


    @server.tool()
    def agent_run_status(context_token: str, run_id: str) -> str:
        """读取当前用户指定任务的状态。"""
        return _call("agent_run_status", context_token, run_id=run_id)


    @server.tool()
    def ui_view_show(context_token: str, intent: Literal["system_overview", "network_overview", "usage_analysis", "agent_run_analysis"], resources: list[str] = []) -> str:
        """展示持久化图表。服务器趋势用 system_overview 和 []；任务分析用 agent_run_analysis 和 ["agent-run/<run_id>"]。"""
        return _call("ui_view_show", context_token, intent=intent, resources=resources)


    @server.tool()
    def task_create(context_token: str, goal: str, idempotency_key: str) -> str:
        """创建可追踪的只读 Ops 持久任务。每个新请求用唯一 idempotency_key；网络重试复用同一 key。返回 task_id/run_id。"""
        return _call("task_create", context_token, goal=goal, idempotency_key=idempotency_key)


    @server.tool()
    def task_cancel(context_token: str, run_id: str) -> str:
        """仅在用户要求停止任务时取消当前用户的指定任务。"""
        return _call("task_cancel", context_token, run_id=run_id)


    async def main() -> None:
        if not BRIDGE_KEY:
            print("JARVIS_BRIDGE_KEY is required", file=sys.stderr)
            raise SystemExit(2)
        await server.run_stdio_async()


    if __name__ == "__main__":
        asyncio.run(main())

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: jarvis
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-core
  namespace: jarvis
spec:
  replicas: 1
  selector:
    matchLabels: { app: hermes-core }
  template:
    metadata:
      labels: { app: hermes-core }
      annotations:
        config-version: hermes-agent-profile-20260921-r2
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-hermes-data
          image: docker.io/nousresearch/hermes-agent@sha256:61b5b208cbda39186457116e4d267096bda7f503a135eef1572df3d8df216a7b
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export HERMES_HOME=/opt/data
              cp /opt/jarvis-mcp/config.yaml /opt/data/config.yaml
              python - <<'PY'
              import base64, hashlib, hmac, os, subprocess, yaml
              from dotenv import set_key
              base = os.environ["API_SERVER_KEY"]
              profile = os.environ.get("JARVIS_PROFILE_API_KEY") or base64.urlsafe_b64encode(hmac.new(base.encode(), b"hermes-profile:jarvis", hashlib.sha256).digest()).rstrip(b"=").decode()
              if os.path.exists("/opt/data/.env"):
                  os.chmod("/opt/data/.env", 0o644)
              set_key("/opt/data/.env", "API_SERVER_KEY", base)
              profile_dir = "/opt/data/profiles/jarvis"
              if not os.path.exists(profile_dir):
                  subprocess.run(["hermes", "profile", "create", "jarvis", "--clone", "--description", "Jarvis personal cloud coordinator"], check=True)
              elif not os.path.exists(os.path.join(profile_dir, "config.yaml")):
                  raise RuntimeError("Jarvis Hermes profile exists but is incomplete")
              profile_env = os.path.join(profile_dir, ".env")
              if os.path.exists(profile_env):
                  os.chmod(profile_env, 0o644)
              set_key(profile_env, "API_SERVER_KEY", profile)
              soul_path = os.path.join(profile_dir, "SOUL.md")
              if not os.path.exists(soul_path):
                  with open(soul_path, "w", encoding="utf-8") as soul:
                      soul.write("You are Jarvis, the user's personal cloud coordinator. Use your configured Hermes Skills, MCP servers, and tools. Use the Jarvis MCP server for authoritative Jarvis state, permissions, UI views, and durable tasks. Be concise, truthful, and never invent unavailable state.\n")
              meta_path = os.path.join(profile_dir, "profile.yaml")
              try:
                  with open(meta_path, encoding="utf-8") as meta_file:
                      meta = yaml.safe_load(meta_file) or {}
              except FileNotFoundError:
                  meta = {}
              if not isinstance(meta, dict):
                  raise RuntimeError("Jarvis Hermes profile metadata is not a mapping")
              meta["description"] = "Jarvis personal cloud coordinator"
              ui_meta = meta.get("ui_meta") if isinstance(meta.get("ui_meta"), dict) else {}
              bot_meta = ui_meta.get("hermes-bots") if isinstance(ui_meta.get("hermes-bots"), dict) else {}
              bot_meta.setdefault("title", "Jarvis")
              ui_meta["hermes-bots"] = bot_meta
              meta["ui_meta"] = ui_meta
              with open(meta_path, "w", encoding="utf-8") as meta_file:
                  yaml.safe_dump(meta, meta_file, sort_keys=False, allow_unicode=True)
              subprocess.run(["hermes", "-p", "jarvis", "chat", "-c", "Bot Chat", "--create-if-missing"], check=True)
              PY
              chmod 600 /opt/data/.env /opt/data/profiles/jarvis/.env
              chown -R 10000:10000 /opt/data
          env:
            - name: API_SERVER_KEY
              valueFrom: { secretKeyRef: { name: hermes-api, key: API_SERVER_KEY } }
            - name: JARVIS_PROFILE_API_KEY
              valueFrom: { secretKeyRef: { name: hermes-api, key: JARVIS_API_SERVER_KEY, optional: true } }
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: mcp, mountPath: /opt/jarvis-mcp, readOnly: true }
      containers:
        - name: hermes
          image: jarvis-hermes-dashboard:20260920
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          args: ["hermes", "gateway", "run"]
          env:
            - { name: HERMES_HOME, value: "/opt/data" }
            - { name: HERMES_DASHBOARD, value: "true" }
            - { name: HERMES_DASHBOARD_HOST, value: "0.0.0.0" }
            - { name: HERMES_DASHBOARD_PORT, value: "9119" }
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom: { secretKeyRef: { name: hermes-api, key: DASHBOARD_USERNAME } }
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom: { secretKeyRef: { name: hermes-api, key: DASHBOARD_PASSWORD } }
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_KEY
              valueFrom: { secretKeyRef: { name: hermes-api, key: API_SERVER_KEY } }
            - name: JARVIS_PROFILE_API_KEY
              valueFrom: { secretKeyRef: { name: hermes-api, key: JARVIS_API_SERVER_KEY, optional: true } }
            - name: DEEPSEEK_API_KEY
              valueFrom: { secretKeyRef: { name: hermes-provider, key: DEEPSEEK_API_KEY } }
            - name: JARVIS_INTERNAL_URL
              value: http://100.77.157.73:8080
            - name: JARVIS_BRIDGE_KEY
              valueFrom: { secretKeyRef: { name: hermes-bridge, key: bridge-key } }
            # Hermes native Skills, toolsets and configured MCP servers are
            # available to the Jarvis Agent. Native terminal/file access remains
            # local to this container; host/project execution uses Node Bridge.
            - name: TERMINAL_ENV
              value: local
          ports:
            - { name: http, containerPort: 8642 }
            - { name: dashboard, containerPort: 9119 }
          startupProbe: { httpGet: { path: /health, port: http }, failureThreshold: 60, periodSeconds: 10, timeoutSeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: http }, failureThreshold: 12, periodSeconds: 10, timeoutSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 120, failureThreshold: 6, periodSeconds: 30, timeoutSeconds: 10 }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: mcp, mountPath: /opt/jarvis-mcp, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: hermes-data } }
        - { name: mcp, configMap: { name: hermes-jarvis-mcp, defaultMode: 0555 } }
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-core
  namespace: jarvis
spec:
  selector: { app: hermes-core }
  ports:
    - { name: http, port: 8642, targetPort: http }
    - { name: dashboard, port: 9119, targetPort: dashboard }
