# The existing hermes-api Secret is managed separately; never apply a placeholder key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-jarvis-mcp
  namespace: jarvis
data:
  config.yaml: |
    model:
      provider: "deepseek"
      # DeepSeek's public API identifier for the V4.1-Flash release.
      default: "deepseek-flash"
    # Run the Jarvis profile as the only standalone gateway. The default profile
    # remains registered for Hermes internals but is intentionally stopped.
    gateway:
      multiplex_profiles: false
    # Hermes native Skills, toolsets and configured MCP servers are available to
    # the Jarvis Agent profile.
    mcp_servers:
      jarvis:
        command: /opt/hermes/.venv/bin/python
        args: ["/opt/jarvis-source/jarvis_provider.py"]
        env:
          JARVIS_INTERNAL_URL: "${JARVIS_INTERNAL_URL}"
          JARVIS_BRIDGE_KEY: "${JARVIS_BRIDGE_KEY}"
      homeassistant:
        command: /opt/hermes/.venv/bin/python
        args: ["/opt/jarvis-source/upstream_provider.py"]
        env:
          MCP_PROVIDER: "homeassistant"
          MCP_EXTRAS: camera
          JARVIS_INTERNAL_URL: "${JARVIS_INTERNAL_URL}"
          JARVIS_BRIDGE_KEY: "${JARVIS_BRIDGE_KEY}"
      immich:
        command: /opt/hermes/.venv/bin/python
        args: ["/opt/jarvis-source/upstream_provider.py"]
        env:
          MCP_PROVIDER: "immich"
          JARVIS_INTERNAL_URL: "${JARVIS_INTERNAL_URL}"
          JARVIS_BRIDGE_KEY: "${JARVIS_BRIDGE_KEY}"
      apps:
        command: /opt/hermes/.venv/bin/python
        args: ["/opt/jarvis-source/apps_provider.py"]
        env:
          JARVIS_INTERNAL_URL: "${JARVIS_INTERNAL_URL}"
          JARVIS_BRIDGE_KEY: "${JARVIS_BRIDGE_KEY}"
  jarvis_provider.py: |
    """Jarvis capability provider for the Hermes Jarvis Agent.

    The canonical source is bundled in the versioned Jarvis Hermes image. This
    ConfigMap entry only delegates to it, so an older deployment that still runs
    /opt/jarvis-mcp/jarvis_provider.py cannot drift from the shipped provider.
    """

    from runpy import run_path

    run_path("/opt/jarvis-source/jarvis_provider.py", run_name="__main__")
    raise SystemExit(0)
  media_janitor.py: |
    """Bounded cleanup for temporary images produced during Jarvis conversations."""

    from __future__ import annotations

    import os
    import time
    from pathlib import Path


    MEDIA_SUFFIXES = {".png", ".jpg", ".jpeg", ".webp"}


    def prune(root: Path, now: float | None = None, ttl_seconds: int = 12 * 60 * 60, max_files: int = 256, max_bytes: int = 512 * 1024 * 1024) -> dict[str, int]:
        now = time.time() if now is None else now
        root.mkdir(parents=True, exist_ok=True)
        files = [path for path in root.iterdir() if path.is_file() and path.suffix.lower() in MEDIA_SUFFIXES]
        removed = 0
        for path in files[:]:
            try:
                stat = path.stat()
            except FileNotFoundError:
                files.remove(path)
                continue
            if now - stat.st_mtime > ttl_seconds or stat.st_size > 16 * 1024 * 1024:
                path.unlink(missing_ok=True)
                files.remove(path)
                removed += 1
        files.sort(key=lambda path: path.stat().st_mtime if path.exists() else 0, reverse=True)
        total = sum(path.stat().st_size for path in files if path.exists())
        for path in files[max_files:]:
            if path.exists():
                total -= path.stat().st_size
                path.unlink(missing_ok=True)
                removed += 1
        files = [path for path in files[:max_files] if path.exists()]
        for path in sorted(files, key=lambda candidate: candidate.stat().st_mtime):
            if total <= max_bytes:
                break
            total -= path.stat().st_size
            path.unlink(missing_ok=True)
            removed += 1
        return {"files": len([path for path in root.iterdir() if path.is_file()]), "bytes": total, "removed": removed}


    def main() -> None:
        root = Path(os.environ.get("MEDIA_ROOT", "/opt/data/media/tmp"))
        ttl = int(os.environ.get("MEDIA_TTL_SECONDS", str(12 * 60 * 60)))
        max_files = int(os.environ.get("MEDIA_MAX_FILES", "256"))
        max_bytes = int(os.environ.get("MEDIA_MAX_BYTES", str(512 * 1024 * 1024)))
        interval = int(os.environ.get("MEDIA_INTERVAL_SECONDS", "300"))
        while True:
            try:
                result = prune(root, ttl_seconds=ttl, max_files=max_files, max_bytes=max_bytes)
                print(f"media_janitor files={result['files']} bytes={result['bytes']} removed={result['removed']}", flush=True)
            except Exception as error:
                print(f"media_janitor error={error}", flush=True)
            time.sleep(interval)


    if __name__ == "__main__":
        main()
  upstream_provider.py: |
    """Policy-gated MCP entry point for one household upstream service.

    The canonical source is bundled in the versioned Jarvis Hermes image; see
    jarvis_provider.py above for why this entry is a delegating shim.
    """

    from runpy import run_path

    run_path("/opt/jarvis-source/upstream_provider.py", run_name="__main__")
    raise SystemExit(0)
  apps_provider.py: |
    """Catalog provider for every app configured after startup.

    The canonical source is bundled in the versioned Jarvis Hermes image; this
    entry only delegates so the ConfigMap cannot drift from the image.
    """

    from runpy import run_path

    run_path("/opt/jarvis-source/apps_provider.py", run_name="__main__")
    raise SystemExit(0)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: jarvis
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-core
  namespace: jarvis
spec:
  replicas: 1
  selector:
    matchLabels: { app: hermes-core }
  template:
    metadata:
      labels: { app: hermes-core }
      annotations:
        config-version: hermes-agent-profile-20260928-jarvis-standalone
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-hermes-data
          image: docker.io/nousresearch/hermes-agent@sha256:61b5b208cbda39186457116e4d267096bda7f503a135eef1572df3d8df216a7b
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export HERMES_HOME=/opt/data
              cp /opt/jarvis-mcp/config.yaml /opt/data/config.yaml
              python - <<'PY'
              import base64, hashlib, hmac, json, os, shutil, subprocess, yaml
              from pathlib import Path
              from dotenv import set_key
              base = os.environ["API_SERVER_KEY"]
              profile = os.environ.get("JARVIS_PROFILE_API_KEY") or base64.urlsafe_b64encode(hmac.new(base.encode(), b"hermes-profile:jarvis", hashlib.sha256).digest()).rstrip(b"=").decode()
              if os.path.exists("/opt/data/.env"):
                  os.chmod("/opt/data/.env", 0o644)
              set_key("/opt/data/.env", "API_SERVER_KEY", base)
              profile_dir = "/opt/data/profiles/jarvis"
              if not os.path.exists(profile_dir):
                  subprocess.run(["hermes", "profile", "create", "jarvis", "--clone", "--description", "Jarvis personal cloud coordinator"], check=True)
              elif not os.path.exists(os.path.join(profile_dir, "config.yaml")):
                  raise RuntimeError("Jarvis Hermes profile exists but is incomplete")
              profile_config_path = os.path.join(profile_dir, "config.yaml")
              with open(profile_config_path, encoding="utf-8") as profile_config_file:
                  profile_config = yaml.safe_load(profile_config_file) or {}
              if not isinstance(profile_config, dict):
                  raise RuntimeError("Jarvis Hermes profile config is not a mapping")
              media_tmp = Path("/opt/data/media/tmp")
              media_tmp.mkdir(parents=True, exist_ok=True)
              for candidate in Path("/opt/data").iterdir():
                  if candidate.is_file() and candidate.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp"}:
                      target = media_tmp / candidate.name
                      if not target.exists():
                          shutil.copy2(candidate, target)
                      candidate.unlink()
              profile_env = os.path.join(profile_dir, ".env")
              if os.path.exists(profile_env):
                  os.chmod(profile_env, 0o644)
              set_key(profile_env, "API_SERVER_KEY", profile)
              set_key(profile_env, "JARVIS_INTERNAL_URL", os.environ["JARVIS_INTERNAL_URL"])
              set_key(profile_env, "JARVIS_BRIDGE_KEY", os.environ["JARVIS_BRIDGE_KEY"])
              soul_path = os.path.join(profile_dir, "SOUL.md")
              with open(soul_path, "w", encoding="utf-8") as soul:
                  soul.write("You are Jarvis, the user's personal cloud coordinator. Use your configured Hermes Skills, MCP servers, and tools. Use the Jarvis MCP server for authoritative Jarvis state, permissions, UI views, and durable tasks. Preserve MEDIA_RESOURCE markers returned by approved photo tools. For Home Assistant cameras, discover the current camera entities at request time and never assume or cache a device, entity, or area. Never create public photo sharing links or expose local filesystem paths. Be concise, truthful, and never invent unavailable state.\n")
              meta_path = os.path.join(profile_dir, "profile.yaml")
              try:
                  with open(meta_path, encoding="utf-8") as meta_file:
                      meta = yaml.safe_load(meta_file) or {}
              except FileNotFoundError:
                  meta = {}
              if not isinstance(meta, dict):
                  raise RuntimeError("Jarvis Hermes profile metadata is not a mapping")
              with open("/opt/data/config.yaml", encoding="utf-8") as base_config_file:
                  base_config = yaml.safe_load(base_config_file) or {}
              if not isinstance(base_config, dict) or not isinstance(base_config.get("mcp_servers"), dict):
                  raise RuntimeError("Jarvis Hermes base config has no MCP servers")
              profile_config["mcp_servers"] = base_config["mcp_servers"]
              with open(profile_config_path, "w", encoding="utf-8") as profile_config_file:
                  yaml.safe_dump(profile_config, profile_config_file, sort_keys=False, allow_unicode=True)
              meta["description"] = "Jarvis personal cloud coordinator"
              ui_meta = meta.get("ui_meta") if isinstance(meta.get("ui_meta"), dict) else {}
              bot_meta = ui_meta.get("hermes-bots") if isinstance(ui_meta.get("hermes-bots"), dict) else {}
              bot_meta.setdefault("title", "Jarvis")
              ui_meta["hermes-bots"] = bot_meta
              meta["ui_meta"] = ui_meta
              with open(meta_path, "w", encoding="utf-8") as meta_file:
                  yaml.safe_dump(meta, meta_file, sort_keys=False, allow_unicode=True)
              def set_gateway_desired_state(profile_path, desired_state):
                  state_path = Path(profile_path) / "gateway_state.json"
                  try:
                      with open(state_path, encoding="utf-8") as state_file:
                          state = json.load(state_file)
                  except (FileNotFoundError, json.JSONDecodeError):
                      state = {}
                  if not isinstance(state, dict):
                      state = {}
                  state["desired_state"] = desired_state
                  with open(state_path, "w", encoding="utf-8") as state_file:
                      json.dump(state, state_file, separators=(",", ":"))
                      state_file.write("\n")
              set_gateway_desired_state("/opt/data", "stopped")
              set_gateway_desired_state(profile_dir, "running")
              subprocess.run(["hermes", "-p", "jarvis", "chat", "-c", "Bot Chat", "--create-if-missing"], check=True)
              PY
              chmod 600 /opt/data/.env /opt/data/profiles/jarvis/.env
              chown -R 10000:10000 /opt/data
              chmod 750 /opt/data
              chmod 770 /opt/data/media /opt/data/media/tmp
          env:
            - name: API_SERVER_KEY
              valueFrom: { secretKeyRef: { name: hermes-api, key: API_SERVER_KEY } }
            - name: JARVIS_PROFILE_API_KEY
              valueFrom: { secretKeyRef: { name: hermes-api, key: JARVIS_API_SERVER_KEY, optional: true } }
            - name: JARVIS_INTERNAL_URL
              value: http://jarvis-server:8080
            - name: JARVIS_BRIDGE_KEY
              valueFrom: { secretKeyRef: { name: hermes-bridge, key: bridge-key } }
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: mcp, mountPath: /opt/jarvis-mcp, readOnly: true }
      containers:
        - name: hermes
          image: jarvis-hermes-dashboard:20261001-ha-camera-r3
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          args: ["hermes", "-p", "jarvis", "gateway", "run"]
          env:
            - { name: HERMES_HOME, value: "/opt/data" }
            - { name: HERMES_DASHBOARD, value: "true" }
            - { name: HERMES_DASHBOARD_HOST, value: "0.0.0.0" }
            - { name: HERMES_DASHBOARD_PORT, value: "9119" }
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom: { secretKeyRef: { name: hermes-api, key: DASHBOARD_USERNAME } }
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom: { secretKeyRef: { name: hermes-api, key: DASHBOARD_PASSWORD } }
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_KEY
              valueFrom: { secretKeyRef: { name: hermes-api, key: API_SERVER_KEY } }
            - name: JARVIS_PROFILE_API_KEY
              valueFrom: { secretKeyRef: { name: hermes-api, key: JARVIS_API_SERVER_KEY, optional: true } }
            - name: DEEPSEEK_API_KEY
              valueFrom: { secretKeyRef: { name: hermes-provider, key: DEEPSEEK_API_KEY } }
            - name: JARVIS_INTERNAL_URL
              value: http://jarvis-server:8080
            - name: JARVIS_BRIDGE_KEY
              valueFrom: { secretKeyRef: { name: hermes-bridge, key: bridge-key } }
            # Hermes native Skills, toolsets and configured MCP servers are
            # available to the Jarvis Agent. Native terminal/file access remains
            # local to this container; host/project execution uses Node Bridge.
            - name: TERMINAL_ENV
              value: local
          ports:
            - { name: http, containerPort: 8642 }
            - { name: dashboard, containerPort: 9119 }
          startupProbe: { httpGet: { path: /health, port: http }, failureThreshold: 60, periodSeconds: 10, timeoutSeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: http }, failureThreshold: 12, periodSeconds: 10, timeoutSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 120, failureThreshold: 6, periodSeconds: 30, timeoutSeconds: 10 }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: mcp, mountPath: /opt/jarvis-mcp, readOnly: true }
        - name: media-janitor
          image: jarvis-hermes-dashboard:20261001-ha-camera-r3
          imagePullPolicy: IfNotPresent
          command: ["/opt/hermes/.venv/bin/python", "/opt/jarvis-mcp/media_janitor.py"]
          env:
            - { name: MEDIA_ROOT, value: "/opt/data/media/tmp" }
            - { name: MEDIA_TTL_SECONDS, value: "43200" }
            - { name: MEDIA_MAX_FILES, value: "256" }
            - { name: MEDIA_MAX_BYTES, value: "536870912" }
            - { name: MEDIA_INTERVAL_SECONDS, value: "300" }
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: mcp, mountPath: /opt/jarvis-mcp, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: hermes-data } }
        - { name: mcp, configMap: { name: hermes-jarvis-mcp, defaultMode: 0555 } }
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-core
  namespace: jarvis
spec:
  selector: { app: hermes-core }
  ports:
    - { name: http, port: 8642, targetPort: http }
    - { name: dashboard, port: 9119, targetPort: dashboard }
