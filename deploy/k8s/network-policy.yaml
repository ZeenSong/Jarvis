apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-private
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    # hostNetwork traffic is node-origin traffic; enforcement depends on CNI.
    - from:
        - podSelector:
            matchLabels:
              app: jarvis-server
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-private
spec:
  podSelector:
    matchLabels:
      app: hermes-core
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: jarvis-server
      ports:
        - protocol: TCP
          port: 8642
