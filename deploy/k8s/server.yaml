apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-server
  namespace: jarvis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jarvis-server
  template:
    metadata:
      labels:
        app: jarvis-server
    spec:
      # Read host interfaces and bind only its Tailscale IP (supplied by Secret).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Single-node service IPs: host proxy intercepts DNS even to CoreDNS.
      # Re-resolve from `kubectl -n jarvis get svc` if these Services are recreated.
      hostAliases:
        - ip: 10.43.159.41
          hostnames: [postgres, postgres.jarvis.svc.cluster.local]
        - ip: 10.43.99.133
          hostnames: [hermes-core, hermes-core.jarvis.svc.cluster.local]
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [10000]
      initContainers:
        - name: prepare-hermes-media
          image: jarvis-server:0.3.2-ha-camera-20261001-r3
          imagePullPolicy: IfNotPresent
          command: [node, -e]
          args:
            - "const fs=require('node:fs');fs.mkdirSync('/hermes-data/media/tmp',{recursive:true});fs.chownSync('/hermes-data/media',10000,10000);fs.chownSync('/hermes-data/media/tmp',10000,10000);fs.chmodSync('/hermes-data/media',0o770);fs.chmodSync('/hermes-data/media/tmp',0o770)"
          securityContext: { runAsNonRoot: false, runAsUser: 0, runAsGroup: 0 }
          volumeMounts:
            - name: hermes-data
              mountPath: /hermes-data
      containers:
        - name: server
          image: jarvis-server:0.3.2-ha-camera-20261001-r3
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: jarvis-secrets, key: database-url }
            - name: HOST
              valueFrom:
                secretKeyRef: { name: jarvis-secrets, key: tailscale-ip }
            - name: HOST_ROOT
              value: /host
            - name: AUTHENTIK_ISSUER
              value: http://100.77.157.73:9000/application/o/jarvis/
            - name: AUTHENTIK_CLIENT_ID
              value: jarvis-web
            - name: AUTHENTIK_REDIRECT_URI
              value: http://100.77.157.73:8080/api/v2/auth/oidc/callback
            - name: AUTHENTIK_OIDC_SCOPES
              value: openid profile email
            - name: PRICES_FILE
              value: /config/prices.json
            - name: HERMES_URL
              value: http://hermes-core:8642
            - name: HERMES_PROFILE
              value: jarvis
            - name: HERMES_MODEL
              value: deepseek-flash
            - name: HERMES_DASHBOARD_URL
              value: http://hermes-core:9119
            - name: HERMES_DASHBOARD_PROXY_USERNAME
              valueFrom: { secretKeyRef: { name: hermes-api, key: DASHBOARD_USERNAME } }
            - name: HERMES_DASHBOARD_PROXY_PASSWORD
              valueFrom: { secretKeyRef: { name: hermes-api, key: DASHBOARD_PASSWORD } }
            - name: HERMES_MEDIA_ROOT
              value: /hermes-media
            - name: HERMES_ENABLED
              value: "1"
            - name: CORE_MODEL
              value: deepseek-flash
            - name: CASAOS_SESSION_FILE
              value: /var/lib/jarvis-casaos/casaos-session.json
            - name: CASAOS_PUBLIC_URL
              value: http://100.77.157.73
            - name: HOME_ASSISTANT_URL
              value: http://100.77.157.73:8123
            - name: HOME_ASSISTANT_TOKEN
              valueFrom:
                secretKeyRef: { name: jarvis-integrations, key: home-assistant-token, optional: true }
            - name: IMMICH_URL
              value: http://100.77.157.73:2283
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef: { name: jarvis-integrations, key: immich-api-key, optional: true }
            - name: HERMES_API_KEY
              valueFrom:
                secretKeyRef: { name: hermes-api, key: API_SERVER_KEY, optional: true }
            - name: HERMES_PROFILE_API_KEY
              valueFrom:
                secretKeyRef: { name: hermes-api, key: JARVIS_API_SERVER_KEY, optional: true }
            - name: HERMES_BRIDGE_KEY
              valueFrom:
                secretKeyRef: { name: hermes-bridge, key: bridge-key, optional: true }
            - name: INTEGRATION_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef: { name: jarvis-secrets, key: integration-credential-key, optional: true }
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          # exec connects to the configured Tailnet listener, not another host interface.
          readinessProbe:
            exec:
              command: [node, -e, "fetch('http://'+process.env.HOST+':8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [node, -e, "fetch('http://'+process.env.HOST+':8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            exec:
              command: [node, -e, "fetch('http://'+process.env.HOST+':8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: casaos-session
              mountPath: /var/lib/jarvis-casaos
            - name: host
              mountPath: /host
              readOnly: true
            - name: prices
              mountPath: /config
              readOnly: true
            - name: hermes-data
              mountPath: /hermes-media
              subPath: media
              readOnly: true
      volumes:
        - name: casaos-session
          hostPath:
            path: /home/root2023/Codes/Projects/Jarvis/.local/m3-production-casaos
            type: Directory
        - name: host
          hostPath:
            path: /
            type: Directory
        - name: prices
          configMap:
            name: jarvis-prices
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-server
  namespace: jarvis
spec:
  selector:
    app: jarvis-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
