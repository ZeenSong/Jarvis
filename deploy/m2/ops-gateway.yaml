apiVersion: apps/v1
kind: Deployment
metadata: {name: ops-read-gateway, namespace: jarvis-workers}
spec:
  replicas: 1
  selector: {matchLabels: {app: ops-read-gateway}}
  template:
    metadata: {labels: {app: ops-read-gateway}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: jarvis-server:0.2.0-rc.1
          command: [node, dist/apps/worker-controller/src/ops-gateway-main.js]
          env:
            - name: GATEWAY_ORIGIN
              valueFrom: {configMapKeyRef: {name: worker-config, key: gateway-origin}}
            - name: OPS_TOKEN
              valueFrom: {secretKeyRef: {name: ops-access, key: token}}
          ports: [{containerPort: 8092}]
          readinessProbe: {httpGet: {path: /health, port: 8092}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: ops-read-gateway, namespace: jarvis-workers}
spec:
  selector: {app: ops-read-gateway}
  ports: [{port: 8092, targetPort: 8092}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ops-read-gateway, namespace: jarvis-workers}
spec:
  podSelector: {matchLabels: {app: ops-read-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: jarvis-worker, role: pydantic}}}]
      ports: [{protocol: TCP, port: 8092}]
  egress:
    - to: [{ipBlock: {cidr: __GATEWAY_IP__/32}}]
      ports: [{protocol: TCP, port: 8080}]
